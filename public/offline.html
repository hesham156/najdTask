<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لا يوجد اتصال — نجد</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #1e293b;
        font-family: Tahoma, Arial, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .box {
        max-width: 22rem;
      }
      .mark {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1rem;
        border-radius: 1rem;
        background: #1f41f5;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 1.5rem;
        font-weight: 700;
      }
      h1 {
        font-size: 1.125rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.875rem;
        color: #64748b;
        line-height: 1.7;
      }
      button {
        border: 0;
        border-radius: 0.5rem;
        background: #1f41f5;
        color: #fff;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
        font-family: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="mark">ن</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        النظام يحتاج اتصالًا بالشبكة لعرض أحدث بيانات الأوردرات. تأكد من الاتصال ثم حاول مرة أخرى.
      </p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
